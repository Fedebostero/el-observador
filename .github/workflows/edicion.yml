name: Edición diaria

on:
  schedule:
    # 09:00 UTC = 06:00 en Argentina (UTC-3, sin horario de verano).
    # GitHub puede demorar unos minutos, así queda lista antes de las 07:00.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edicion
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar la edición
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py

      - name: Publicar
        run: |
          git config user.name "El Observador"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Edición $(date -u +%F)"
            git push
          fi
